<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="icon" href="../assets/icon.png">
    <link rel="stylesheet" href="login.css">
    <title>BorderKick - Login</title>
</head>
<body>
    <h1>Login BorderKick</h1>

    <form>

        <label for="Email">E-mail:</label><br>
        <input required type="email" id="Email" name="Email" placeholder="name@example.com"><br><br>

        <label for="Senha">Senha:</label><br>
        <input required type="password" id="Senha" name="Senha" placeholder="Insira sua senha" minlength="8"><br><br>

        <button type="submit">Entrar</button>

    </form>

    <br>

    <button onclick="window.location.href='../index.html'">Voltar</button>
    <a href="../cadastro/cadastro.html">Não possui login? Cadastre-se aqui</a>

</body>
</html>
