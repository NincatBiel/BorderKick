<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="icon" href="../assets/icon.png">
    <link rel="stylesheet" href="login.css">
    <title>BorderKick - Login</title>
</head>
<body>
    
    <header>
        <img src="../assets/logo.png" alt="BorderKick Logo">
    </header>

    <main>

        <div class="welcome">
            <h1>Entrar na conta</h1>
            <a href="../cadastro/cadastro.html" class="register">Não possui login? Cadastre-se aqui</a>
        </div>

        <form>
            <div>
                <label for="Email">E-mail:</label><br>
                <input required type="email" name="Email" id="Email" placeholder="name@example.com">
            </div>

            <div>
                <label for="Senha">Senha:</label><br>
                <input required type="password" name="Senha" id="Senha" placeholder="Insira sua senha" minlength="8">
            </div>

            <button type="submit">Entrar</button>
        </form>

        <button onclick="window.location.href='../index.html'" id="back-button">Voltar para o início</button>
    </main>
</body>
</html>
